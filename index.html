<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENEL Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background:#0f0f14;
  font-family:Poppins;
}

.app {
  max-width:420px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

/* ROOM */
.room-bar {
  padding:10px;
  background:#1a1a22;
  display:flex;
  gap:5px;
}
.room-bar input {
  flex:1;
  padding:8px;
  border-radius:10px;
  border:none;
  background:#2a2a35;
  color:white;
}

/* HEADER */
.header {
  padding:10px;
  background:#1a1a22;
  color:white;
}

/* CHAT */
.chat-box {
  flex:1;
  overflow-y:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
}

.message {
  padding:10px;
  margin:6px;
  border-radius:18px;
  max-width:70%;
  display:inline-block;
}

/* POSISI */
.sender {
  background:#ff4ecd;
  color:white;
  align-self:flex-end;
}

.receiver {
  background:#1c1c25;
  color:white;
  align-self:flex-start;
}

/* USERNAME */
.username {
  font-size:11px;
  opacity:0.7;
  margin-bottom:4px;
}

.sender .username {
  color:#ffd6f5;
}

.receiver .username {
  color:#aaa;
}

/* TIME */
.time {
  font-size:10px;
  opacity:0.6;
}

/* INPUT */
.input-box {
  display:flex;
  padding:10px;
  background:#1a1a22;
}

.input-box input {
  flex:1;
  padding:10px;
  border-radius:20px;
  border:none;
  background:#2a2a35;
  color:white;
}

button {
  border:none;
  border-radius:10px;
  background:#ff4ecd;
  color:white;
  padding:8px 12px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="app">

<div class="room-bar">
  <input id="roomInput" placeholder="Room code..." />
  <button onclick="joinRoom()">Join</button>
</div>

<div class="header">ENEL Chat Room</div>

<div id="chatBox" class="chat-box"></div>

<div class="input-box">
  <input id="messageInput" placeholder="Type message..." />
  <button id="sendBtn">➤</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, off } 
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAyVU9uwtZmugQuQOSz_4Bph3SR46O4Xqs",
  authDomain: "dawn-38a84.firebaseapp.com",
  databaseURL: "https://dawn-38a84-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dawn-38a84"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* USER */
let userId = localStorage.getItem("uid");
if (!userId) {
  userId = prompt("Masukin nama lo:");
  localStorage.setItem("uid", userId);
}

/* ELEMENT */
const chatBox = document.getElementById("chatBox");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

/* STATE */
let chatRef = null;
let currentRoom = null;

/* JOIN ROOM */
window.joinRoom = function() {
  const room = document.getElementById("roomInput").value.trim();
  if (!room) return alert("Isi room dulu!");
  if (room === currentRoom) return;

  currentRoom = room;
  chatBox.innerHTML = "";

  /* stop listener lama */
  if (chatRef) off(chatRef);

  chatRef = ref(db, "chats/" + room);

  /* listen baru */
  onChildAdded(chatRef, snap => {
    const msg = snap.val();

    const div = document.createElement("div");
    div.classList.add("message");

    if (msg.sender === userId) {
      div.classList.add("sender");
    } else {
      div.classList.add("receiver");
    }

    div.innerHTML = `
      <div class="username">${msg.sender}</div>
      ${msg.text || ""}
      <div class="time">${new Date(msg.time).toLocaleTimeString()}</div>
    `;

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  });
};

/* SEND */
function sendMessage() {
  if (!chatRef) return alert("Join room dulu!");
  if (!input.value.trim()) return;

  push(chatRef, {
    text: input.value,
    sender: userId,
    time: Date.now()
  });

  input.value = "";
}

sendBtn.onclick = sendMessage;

input.addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});

</script>

</body>
</html>
