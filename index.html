<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* 🔥 CONFIG FIREBASE (punya lo udah gue masukin) */
const firebaseConfig = {
  apiKey: "AIzaSyAyVU9uwtZmugQuQOSz_4Bph3SR4604Xqs",
  authDomain: "dawn-38a84.firebaseapp.com",
  databaseURL: "https://dawn-38a84-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dawn-38a84",
  storageBucket: "dawn-38a84.appspot.com",
  messagingSenderId: "965175436083",
  appId: "1:965175436083:web:38d765d24bf176bb881446"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* 🔑 ROOM & USER */
const room = prompt("Masukin kode room (contoh: aisha123)");
const username = prompt("Nama kamu:");

/* 💬 KIRIM PESAN */
window.send = function () {
  let text = document.getElementById("msg").value;
  if (!text) return;

  push(ref(db, "chat/" + room), {
    name: username,
    text: text
  });

  document.getElementById("msg").value = "";
};

/* 📩 TERIMA PESAN REALTIME */
onChildAdded(ref(db, "chat/" + room), (snapshot) => {
  let data = snapshot.val();

  let div = document.createElement("div");
  div.innerText = data.name + ": " + data.text;

  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 9999;
});
</script>
