<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Private Chat 💬</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #111;
    color: white;
}

.chat {
    height: 85vh;
    overflow-y: auto;
    padding: 10px;
}

.msg {
    margin: 10px;
    padding: 10px 15px;
    border-radius: 15px;
    max-width: 70%;
}

.me { background: #ff4d6d; margin-left: auto; }
.other { background: #333; }

.input-box {
    display: flex;
    position: fixed;
    bottom: 0;
    width: 100%;
}

input {
    flex: 1;
    padding: 15px;
    border: none;
}

button {
    padding: 15px;
    border: none;
    background: #ff4d6d;
    color: white;
}
</style>
</head>

<body>

<div class="chat" id="chat"></div>

<div class="input-box">
    <input id="msg" placeholder="Type message...">
    <button onclick="send()">Send</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* 🔥 CONFIG FIREBASE LO */
const firebaseConfig = {
  apiKey: "AIzaSyAyVU9uwtZmugQuQOSz_4Bph3SR4604Xqs",
  authDomain: "dawn-38a84.firebaseapp.com",
  databaseURL: "https://dawn-38a84-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dawn-38a84",
  storageBucket: "dawn-38a84.appspot.com",
  messagingSenderId: "965175436083",
  appId: "1:965175436083:web:38d765d24bf176bb881446"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* 🔑 USER */
const room = prompt("Masukin kode room:");
const username = prompt("Nama kamu:");

/* 💬 KIRIM */
window.send = function () {
    let text = document.getElementById("msg").value;
    if (!text) return;

    push(ref(db, "chat/" + room), {
        name: username,
        text: text
    });

    document.getElementById("msg").value = "";
};

/* 📩 TERIMA REALTIME */
onChildAdded(ref(db, "chat/" + room), (snapshot) => {
    let data = snapshot.val();

    let div = document.createElement("div");
    div.className = "msg " + (data.name === username ? "me" : "other");
    div.innerText = data.name + ": " + data.text;

    document.getElementById("chat").appendChild(div);
    document.getElementById("chat").scrollTop = 9999;
});
</script>

</body>
</html>
