<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<!-- 🔥 WAJIB biar full layar HP -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Private Chat 💖</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff9aa2, #ffc3a0);
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* HEADER */
.header {
    padding: 15px;
    text-align: center;
    font-weight: bold;
    color: white;
    background: rgba(255, 105, 135, 0.8);
    backdrop-filter: blur(10px);
}

/* CHAT AREA FULL */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
}

/* MESSAGE */
.msg {
    margin: 5px 0;
    padding: 10px 15px;
    border-radius: 20px;
    max-width: 75%;
    font-size: 14px;
    animation: fadeIn 0.25s ease;
    word-wrap: break-word;
}

.me {
    background: #ff4d6d;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 5px;
}

.other {
    background: white;
    color: #333;
    align-self: flex-start;
    border-bottom-left-radius: 5px;
}

/* INPUT FIX BAWAH */
.input-box {
    display: flex;
    padding: 10px;
    background: white;
    position: sticky;
    bottom: 0;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 20px;
    border: none;
    outline: none;
    background: #f1f1f1;
}

button {
    margin-left: 10px;
    padding: 12px 15px;
    border-radius: 20px;
    border: none;
    background: #ff4d6d;
    color: white;
    font-weight: bold;
}

/* ANIMATION */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="header">💖 Private Chat 💖</div>

<div class="chat" id="chat"></div>

<div class="input-box">
    <input id="msg" placeholder="Ketik sesuatu... 😏">
    <button onclick="send()">Send</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* 🔥 CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAyVU9uwtZmugQuQOSz_4Bph3SR4604Xqs",
  authDomain: "dawn-38a84.firebaseapp.com",
  databaseURL: "https://dawn-38a84-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dawn-38a84",
  storageBucket: "dawn-38a84.appspot.com",
  messagingSenderId: "965175436083",
  appId: "1:965175436083:web:38d765d24bf176bb881446"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* USER */
const room = prompt("Kode room:");
const username = prompt("Nama kamu:");

/* SEND */
window.send = function () {
    let text = document.getElementById("msg").value;
    if (!text) return;

    push(ref(db, "chat/" + room), {
        name: username,
        text: text
    });

    document.getElementById("msg").value = "";
};

/* RECEIVE */
onChildAdded(ref(db, "chat/" + room), (snapshot) => {
    let data = snapshot.val();

    let div = document.createElement("div");
    div.className = "msg " + (data.name === username ? "me" : "other");
    div.innerText = data.text;

    document.getElementById("chat").appendChild(div);
    document.getElementById("chat").scrollTop = 999999;
});
</script>

</body>
</html>
