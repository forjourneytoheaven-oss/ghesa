<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ChatBox</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body { margin:0; background:#0f0f14; font-family:Poppins; }

.app { max-width:420px; height:100vh; margin:auto; display:flex; flex-direction:column; }

.header { display:flex; align-items:center; padding:10px; background:#1a1a22; }
.name { color:white; font-size:14px; }

.chat-box { flex:1; overflow-y:auto; padding:10px; }

.message {
  padding:10px;
  margin:6px;
  border-radius:18px;
  max-width:70%;
}

.sender { background:#ff4ecd; color:white; align-self:flex-end; }
.receiver { background:#1c1c25; color:white; }

.time { font-size:10px; opacity:0.6; }

.input-box { display:flex; padding:10px; background:#1a1a22; }

input {
  flex:1;
  padding:10px;
  border-radius:20px;
  border:none;
  background:#2a2a35;
  color:white;
}

button {
  margin-left:10px;
  border:none;
  border-radius:50%;
  background:#ff4ecd;
  color:white;
  width:40px;
  height:40px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
  <div class="name">Chatbox.</div>
</div>

<div id="chatBox" class="chat-box"></div>

<div class="input-box">
  <input id="messageInput" placeholder="Type message..." />
  <button id="sendBtn">➤</button>
  <button id="recordBtn">🎤</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, update } 
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAyVU9uwtZmugQuQOSz_4Bph3SR46O4Xqs",
  authDomain: "dawn-38a84.firebaseapp.com",
  databaseURL: "https://dawn-38a84-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dawn-38a84"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* 🔐 LOGIN SIMPLE */
let userId = localStorage.getItem("uid");
if (!userId) {
  userId = prompt("Masukin nama lo:");
  localStorage.setItem("uid", userId);
}

/* 💬 PRIVATE CHAT (1 room) */
const chatId = "room1";
const chatRef = ref(db, "chats/" + chatId);

/* ELEMENT */
const chatBox = document.getElementById("chatBox");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const recordBtn = document.getElementById("recordBtn");

/* SEND TEXT */
function sendMessage() {
  if (!input.value.trim()) return;

  push(chatRef, {
    text: input.value,
    sender: userId,
    time: Date.now(),
    seen: false
  });

  input.value = "";
}

sendBtn.onclick = sendMessage;
input.addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});

/* 🎤 VOICE NOTE */
let mediaRecorder;
let chunks = [];

recordBtn.onclick = async () => {
  const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  mediaRecorder = new MediaRecorder(stream);

  mediaRecorder.start();
  chunks = [];

  mediaRecorder.ondataavailable = e => chunks.push(e.data);

  mediaRecorder.onstop = () => {
    const blob = new Blob(chunks);

    push(chatRef, {
      audio: URL.createObjectURL(blob),
      sender: userId,
      time: Date.now()
    });
  };

  setTimeout(() => mediaRecorder.stop(), 3000); // record 3 detik
};

/* SHOW MESSAGE */
onChildAdded(chatRef, snap => {
  const msg = snap.val();

  const div = document.createElement("div");
  div.classList.add("message");
  div.classList.add(msg.sender === userId ? "sender" : "receiver");

  if (msg.text) {
    div.innerHTML = msg.text + "<div class='time'>✔✔</div>";
  }

  if (msg.audio) {
    div.innerHTML = `<audio controls src="${msg.audio}"></audio>`;
  }

  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;

  /* ✔✔ READ */
  if (msg.sender !== userId) {
    update(snap.ref, { seen: true });
  }
});

</script>

</body>
</html>
